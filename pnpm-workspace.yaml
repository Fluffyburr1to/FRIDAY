packages:
  - 'apps/*'
  - 'packages/*'
  - 'departments/*'
  - 'connectors/*'
  - 'tools/*'
  - 'packaging/*'

# ── Catalog: one version of each shared dependency, declared once ────────────
#
# Packages write `"vitest": "catalog:"` instead of a version range. With twenty
# packages and a decade ahead, the alternative is twenty ranges that drift —
# and two versions of a test runner or a type definition in one repository is
# a class of bug that costs hours and teaches nothing.
#
# Upgrading is then a one-line change here, reviewed once.
catalog:
  # Toolchain
  '@types/node': ^26.2.0
  '@vitest/coverage-v8': ^4.1.10
  vitest: ^4.1.10

  # Milestone 1 — Heartbeat
  #
  # Each of these is confined to the package that owns it, and for three of the
  # four that confinement is enforced by .dependency-cruiser.cjs rather than by
  # convention. Zod is the exception: it is allowed anywhere, because validating
  # at every boundary is the rule rather than a privilege.
  zod: ^4.4.3 # contracts, config — the single source of truth for data shapes
  drizzle-orm: ^0.45.2 # storage ONLY — deny-listed everywhere else
  better-sqlite3: ^13.0.3 # storage ONLY — see docs/adr/0018
  '@types/better-sqlite3': ^9.6.0 # lags the runtime package; see ADR-0018's negative consequences
  pino: ^10.3.1 # telemetry ONLY, by convention — the redaction layer is the point

  # config ONLY. Node has no TOML parser and Chapter 33 specifies config.toml.
  # A correct TOML 1.0 parser is far past the "prefer fifty lines over a
  # package" threshold — the failure mode of a hand-rolled one is a config file
  # that parses to something subtly different from what it says.
  # See docs/adr/0022.
  smol-toml: ^1.7.1

  # storage ONLY. Cold-tier archives are Parquet so they stay queryable without
  # FRIDAY (Chapter 10). Two packages total — the writer depends only on the
  # reader, which depends on nothing — which is why this won over the
  # better-known alternative that drags in the AWS SDK. See docs/adr/0028.
  #
  # Pinned to exactly what hyparquet-writer depends on, rather than the newest
  # release. Two reasons, and the second is the real one: it keeps a single
  # copy in the tree, and a caret here pulled in a version published hours
  # earlier — which pnpm then wanted to add a minimum-release-age exclusion
  # for. A brand-new release is precisely what that policy exists to keep out,
  # and silently excluding a package defeats it.
  hyparquet: 1.27.1
  'hyparquet-writer': ^0.16.5

  # telemetry ONLY. Chapter 22's rotation rules — daily, 100 MB per file, 30
  # days, and a 1 GB ceiling on the directory — are all this package's options.
  # Chosen over pino-roll; the reasoning is in docs/adr/0023.
  rotating-file-stream: ^3.2.9

  # Milestone 2 — Conscience: the thin dashboard
  #
  # The first dependencies since M1. Each was approved individually rather
  # than as a stack, and the set is deliberately the minimum that makes one
  # real screen work.
  #
  # See docs/adr/0029-apps-core-begins-at-milestone-2-to-serve-the-dashboard.md

  # apps/core + apps/web. Chapter 20 specifies tRPC for the internal API: the client and
  # server share types with no code generation and no schema file to keep in
  # sync, so an invented endpoint or a wrong argument shape is a compile error
  # rather than a runtime surprise the owner has to diagnose from a symptom.
  # The standalone adapter runs on node:http, which is why there is no web
  # framework in this list.
  '@trpc/server': ^11.18.0
  '@trpc/client': ^11.18.0
  '@trpc/tanstack-react-query': ^11.18.0

  # apps/web ONLY. Chapter 06 — the reasoning is explicitly that AI assistants
  # write correct React far more reliably than correct anything else, which is
  # a first-class engineering concern here rather than an embarrassing one.
  react: ^19.2.8
  'react-dom': ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4

  # apps/web ONLY. Chapter 06 assigns server data to TanStack Query and states
  # the rule it exists to enforce: server data is never copied into client
  # state, because copying is how a screen ends up showing a stale approval
  # that was already granted.
  '@tanstack/react-query': ^5.101.4

  # apps/web build tooling. Chapter 06 rejects the meta-frameworks — there is
  # no SEO and no edge to deploy to, the server is your Mac — so Vite is the
  # build tool without the server framework we would not use.
  #
  # Held at 7 rather than 8, and see `overrides` below for why that is
  # load-bearing rather than caution.
  vite: ^7.3.6

  # Held at 5 because 6 requires Vite 8 as a peer and would drag it back in.
  # The 5.2 line spans Vite 4 through 8, so it does not have to move again
  # when Vite does.
  '@vitejs/plugin-react': ^5.2.0

  # apps/web tests ONLY. A component test asserting what the owner actually
  # sees needs a DOM to render into and a way to query it as a person would —
  # by role and by text, rather than by class name, so a test breaks when the
  # screen stops being readable and not when the markup is rearranged.
  #
  # @friday/vitest-config already types `environment` as 'node' | 'jsdom', so
  # jsdom is the one this repository was written expecting.
  jsdom: ^30.0.1
  '@testing-library/react': ^16.3.2
  '@testing-library/dom': ^10.4.1 # peer of the above; pinned so there is one

# ── Overrides ────────────────────────────────────────────────────────────────
#
# The catalog governs what OUR packages ask for. It does not govern what a
# dependency asks for, and Vitest declares Vite as its own dependency with a
# range spanning three majors.
#
# Declaring Vite here for the first time forced that range to re-resolve, and
# it landed on Vite 8 for every package in the repository — including the ones
# that have never heard of Vite. Vite 8 transforms with oxc, which reads a
# package's tsconfig but does not call realpath on it, so
# `extends: "@friday/tsconfig/library.json"` resolves through pnpm's symlink
# and then looks for tsconfig.base.json inside that package's own
# node_modules, where it is not. Every test file in the repository stopped
# transforming.
#
# This is the same "one version of each shared dependency" rule the catalog
# states, applied one level down where the catalog cannot reach. The
# alternative fix is rewriting the `extends` in every package to a relative
# path, which trades a real convention for a workaround.
#
# Revisit when Vitest itself moves to Vite 8, or when oxc resolves symlinked
# tsconfig chains.
overrides:
  vite: ^7.3.6

  # GHSA-2v37-7h3g-55p8 — nanoid before 3.3.18 loops forever when a custom
  # generator is asked for zero bytes. Nothing here calls nanoid: it arrives
  # under postcss, under vite, under vitest, and so reaches developer machines
  # and CI but never the artifact — `pnpm deploy --prod` drops the whole chain,
  # and the built bundle contains no copy of it.
  #
  # ★ Held inside the 3.x line on purpose. postcss asks for `^3.3.16`, and
  # 3.3.18 is the patch that fixes this — so the floor moves by two patch
  # versions and nothing else. Written first as `>=3.3.18`, which resolved
  # nanoid to 6.0.1: three majors above what postcss was written against, to
  # fix a loop in a code path this repository never calls. A security patch
  # that silently performs a major upgrade is a second change wearing the
  # first one's justification.
  #
  # Remove when postcss's own floor reaches 3.3.18 and this stops doing
  # anything — an override that no longer changes a resolution is a comment
  # pretending to be configuration.
  nanoid@<3.3.18: ^3.3.18

# pnpm blocks dependency install scripts by default — a good default, since an
# install script runs arbitrary code with your privileges (supply chain, T2).
# Each exception is an explicit decision recorded here.
allowBuilds:
  # Biome's postinstall downloads the native binary for this platform. It is
  # published by the Biome team with npm provenance and the package is our
  # linter, so it is already trusted to read every source file.
  '@biomejs/biome': true
  # Vitest's coverage provider builds no native code; esbuild, which Vite
  # depends on, downloads a prebuilt binary for this platform. Both are part
  # of the test toolchain and already run over every source file.
  esbuild: true
  # better-sqlite3 is a native module: its install script fetches a prebuilt
  # binary for this platform, or compiles one. This is the cost Article VII
  # pays for Drizzle's only mature SQLite dialect, and it is the reason
  # node:sqlite is recorded as the alternative to return to — see
  # docs/adr/0018-better-sqlite3-as-the-sqlite-driver.md
  better-sqlite3: true

# Departments and connectors are workspace members so they can be developed,
# tested, and type-checked alongside the kernel — while dependency-cruiser
# enforces that they may not import each other.
#
# See docs/01-bible/04-monorepo-vs-multirepo.md
